plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.gooddhm.oneulmemo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gooddhm.oneulmemo'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0.${runNo}"
    }

    signingConfigs {
        release {
            storeFile file('oneulmemo.keystore')
            storePassword 'oneulmemo123'
            keyAlias 'oneulmemo'
            keyPassword 'oneulmemo123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
